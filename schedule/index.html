<style>
:root{--blue:#356db7;--deep:#24477f;--sky:#62a0db;--ink:#172033;--mute:#5d6b82;--line:#d8dee9;--bg:#f4f7fb;--red:#c62828;--redbg:#fdecec;--redbg2:#f9d6d6;--green:#1f7a4d;--greenbg:#e5f4ec}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
.top{height:6px;background:linear-gradient(90deg,var(--deep) 0 34%,var(--blue) 34% 67%,var(--sky) 67%)}
main{max-width:1100px;margin:0 auto;padding:14px 12px 40px}
h1{font-size:20px;color:var(--deep);margin:4px 0 2px}
.sub{font-size:13px;color:var(--mute);margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.bar .sp{flex:1}
button,select,input,textarea{font:inherit;font-size:15px}
button{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--deep);font-weight:700;cursor:pointer}
button:hover{background:#e8eef7}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}button.pri:hover{background:var(--deep)}
button.dng{color:var(--red)}
button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
select{min-height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.month{font-size:18px;font-weight:700;min-width:150px;text-align:center}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.card h2{font-size:15px;margin:0 0 8px;color:var(--deep)}
.msg{font-size:13px;color:var(--mute);min-height:18px}.msg.bad{color:var(--red)}
/* pool */
.pool .it{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0}
.pool .it:first-of-type{border-top:0}
.pool .it .t{min-width:0}
.pool .none{font-size:13px;color:var(--mute)}
/* grid */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dow{background:var(--deep);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:7px 0}
.dow.we{background:var(--red)}
.cell{min-height:104px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;cursor:pointer;position:relative;overflow:hidden;background:#fff}
.cell:nth-child(7n+8){border-left:0}
.cell.out{background:#f1f3f7}.cell.out .n{opacity:.45}
.cell.we{background:var(--redbg)}
.cell.hol{background:var(--redbg2)}
.cell.we .n,.cell.hol .n{color:var(--red)}
.cell.today .n{background:var(--blue);color:#fff;border-radius:50%}
.cell.sel{outline:3px solid var(--sky);outline-offset:-3px}
.n{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;font-size:14px;font-weight:700}
.hn{font-size:11px;font-weight:700;color:var(--red);line-height:1.25;margin:1px 0 2px;word-break:break-word}
.chip{display:block;font-size:11.5px;line-height:1.3;padding:2px 5px;margin:2px 0;border-radius:4px;border-left:3px solid var(--blue);background:#e8eef7;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.job{border-left-color:var(--deep);background:#dde7f6}
.chip.me{border-left-color:var(--green);background:var(--greenbg)}
.more{font-size:11px;color:var(--mute)}
.dots{display:none;gap:3px;flex-wrap:wrap;margin-top:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--green);display:block}
.dots i.job{background:var(--deep)}

.ev{border-left:4px solid var(--green);background:#fff;border-radius:8px;padding:8px 10px;margin:8px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ev.job{border-left-color:var(--deep)}
.ev .l{font-size:15px;line-height:1.55;word-break:break-word}
.ev .l b{color:var(--deep)}
.ev .w{font-size:13px;color:var(--mute);margin-top:2px}
.ev .who{font-size:12px;font-weight:700;color:var(--green)}
.ev .acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}.ev .acts button{min-height:32px;font-size:13px;padding:0 10px}
.dayh{font-size:16px;font-weight:700;color:var(--deep);margin:0 0 4px}
.dayh.red{color:var(--red)}
.hol-tag{display:inline-block;background:var(--red);color:#fff;border-radius:6px;font-size:12px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:8px 2px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;background:var(--c);border:1px solid var(--line)}

.modal{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.modal[hidden]{display:none}
.box{background:#fff;border-radius:14px;max-width:460px;width:100%;padding:18px;margin:auto}
.box h2{margin:0 0 8px;color:var(--deep);font-size:18px}
.box label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:10px 0 4px}
.box input,.box textarea,.box select{width:100%;padding:9px 10px;border:1px solid #c5cfdd;border-radius:8px;color:var(--ink);background:#fff}
.box textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box .acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
@media(max-width:640px){
  .cell{min-height:58px;padding:2px}
  .chip,.more{display:none}.dots{display:flex}
  .hn{font-size:9.5px}
  .month{min-width:0;flex:1}
}
@media print{.top,.bar,.pool,.legend,#yeNav,.acts{display:none!important}}
</style>

  var tr=/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|—|to|至|~)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i.exec(s);
  function hm(h,mi,ap){h=+h;mi=+(mi||0);if(ap){ap=ap.toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0}return h<24&&mi<60?p2(h)+':'+p2(mi):''}
  if(tr&&(tr[2]||tr[5]||tr[3]||tr[6])){var a2=tr[3]||tr[6],b2=tr[6]||tr[3];st=hm(tr[1],tr[2],tr[3]||(a2&&+tr[1]<=+tr[4]?a2:''));en=hm(tr[4],tr[5],b2);if(!st||!en){st='';en=''}}
  return{start:dates[0]||'',end:dates.length?dates[dates.length-1]:'',st:st,en:en}}

/* ---------- state ---------- */
var view=new Date(),vy,vm,sel,mode=lsGet('ye_sched_mode')==='list'?'list':'grid';
function nzToday(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Pacific/Auckland'}).format(new Date())}catch(e){return iso(view.getFullYear(),view.getMonth(),view.getDate())}}
var TODAY=nzToday();vy=+TODAY.slice(0,4);vm=+TODAY.slice(5,7)-1;sel=TODAY;
var jobs=[],entries=[],staff=[],jobsStamp='',editing=null;

function gridRange(){var first=dow(vy,vm,1),s=iso(vy,vm,1-first);return{s:s,e:iso(vy,vm,1-first+41)}}
async function loadEntries(){
  var r=gridRange();
  entries=await sb('/rest/v1/ye_sched_entries?select=*&work_date=lte.'+r.e+'&end_date=gte.'+r.s+'&order=work_date.asc,start_time.asc&limit=2000')||[]}
async function loadJobs(){
  jobs=await sb('/rest/v1/ye_sched_jobs?select=*&order=start_date.asc.nullsfirst&limit=1000')||[];
  jobsStamp=jobs.reduce(function(a,j){return j.synced_at>a?j.synced_at:a},'')}
async function syncJobs(){
  /* office only: copy confirmed (signed / paid) quotes, WITHOUT prices, to the table staff can read */
  var q='/rest/v1/ye_records?select=id,type:data->>type,status:data->>status,no:data->>no,client:data->>client,project:data->>project,name:data->>name,loc:data->data->fields->>projectLocation,addr:data->data->fields->>clientAddress,pn:data->data->fields->>projectName,tl:data->data->fields->>timeline&kind=eq.job&deleted=is.false&data-%3E%3Etype=eq.quote&data-%3E%3Estatus=in.(signed,paid)&limit=2000';
  var a=await sb(q)||[];
  var rows=a.map(function(x){var p=parseTimeline(plain(x.tl));
    return{job_id:x.id,doc_no:clean(x.no),client:clean(x.client),project:clean(x.pn)||clean(x.project)||clean(x.name),address:clean(x.loc)||clean(x.addr),timeline:clean(x.tl),
      start_date:p.start||null,end_date:p.end||null,start_time:p.st,end_time:p.en,status:x.status,synced_at:new Date().toISOString()}});
  if(rows.length)await sb('/rest/v1/ye_sched_jobs?on_conflict=job_id',{method:'POST',body:JSON.stringify(rows),prefer:'resolution=merge-duplicates,return=minimal'});
  var keep=rows.map(function(r){return'"'+r.job_id+'"'}).join(',');
  await sb('/rest/v1/ye_sched_jobs?'+(rows.length?'job_id=not.in.('+encodeURIComponent(keep)+')':'job_id=not.is.null'),{method:'DELETE'});
  return rows.length}
async function loadStaff(){
  try{var a=await sb('/rest/v1/ye_staff?select=email,name&order=email')||[];staff=a.map(function(s){return{email:(s.email||'').toLowerCase(),name:s.name||''}});
    var mine=staff.filter(function(s){return s.email===me})[0];if(mine&&mine.name)myName=mine.name}catch(e){}
  if(!myName)myName=me.split('@')[0]}
function nameOf(email){email=(email||'').toLowerCase();var s=staff.filter(function(x){return x.email===email})[0];return(s&&s.name)||email.split('@')[0]}

/* ---------- item helpers ---------- */
function timeStr(st,en){return st?(en?st+'–'+en:st):t('tbc')}
function itemsOn(date){
  var out=[];
  jobs.forEach(function(j){if(j.start_date&&j.start_date<=date&&date<=(j.end_date||j.start_date))out.push({kind:'job',j:j,st:j.start_time||'',en:j.end_time||'',address:j.address,project:j.project,work:t('jobTag')+(j.doc_no?' '+j.doc_no:'')})});
  var f=$('emp').value;
  entries.forEach(function(e){if(e.work_date<=date&&date<=e.end_date){if(isMgr&&f&&e.owner_email.toLowerCase()!==f)return;out.push({kind:'entry',e:e,st:e.start_time,en:e.end_time,address:e.address,project:e.project,work:e.work})}});
  out.sort(function(a,b){return(a.kind===b.kind?0:a.kind==='job'?-1:1)||((a.st||'99')<(b.st||'99')?-1:(a.st||'99')>(b.st||'99')?1:0)});
  return out}
function pool(){return jobs.filter(function(j){return !j.start_date})}
function lineHtml(it){
  return'<div class="l">📍 <b>'+esc(it.address||t('noAddr'))+'</b> · 🏗 '+esc(it.project||t('noProj'))+' · 🕐 '+esc(timeStr(it.st,it.en))+'</div>'}
function chipText(it){return(it.st?it.st+' ':'')+(it.address||it.project||it.work||'')}

/* ---------- render ---------- */
function render(){
  $('ttl').textContent=t('ttl');$('sub').textContent=t('sub');$('today').textContent=t('today');$('add').textContent=t('add');$('vGrid').textContent=t('grid');$('vList').textContent=t('list');
  $('vGrid').className=mode==='grid'?'on':'';$('vList').className=mode==='list'?'on':'';
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  $('mlabel').textContent=lang==='zh'?vy+'年 '+t('months')[vm]:t('months')[vm]+' '+vy;
  $('legend').innerHTML='<span style="--c:'+'#f9d6d6">'+t('legHol')+'</span><span style="--c:#fdecec">'+t('legWe')+'</span><span style="--c:#dde7f6">'+t('legJob')+'</span><span style="--c:#e5f4ec">'+t('legMine')+'</span>';
  renderEmp();renderPool();
  $('gridWrap').hidden=mode!=='grid';$('listWrap').hidden=mode!=='list';
  if(mode==='grid')renderGrid();else renderList();
  renderDay()}
function renderEmp(){
  var s=$('emp');if(!isMgr){s.hidden=true;return}
  var cur=s.value,seen={},opts='<option value="">'+esc(t('allEmp'))+'</option>';
  staff.forEach(function(x){seen[x.email]=1;opts+='<option value="'+esc(x.email)+'">'+esc(x.name||x.email)+'</option>'});
  entries.forEach(function(e){var k=e.owner_email.toLowerCase();if(!seen[k]){seen[k]=1;opts+='<option value="'+esc(k)+'">'+esc(e.owner_name||k)+'</option>'}});
  if(!seen[me]){opts+='<option value="'+esc(me)+'">'+esc(myName||me)+'</option>'}
  s.innerHTML=opts;s.value=cur;s.hidden=false}
function renderPool(){
  var p=pool(),h='<h2>'+esc(t('pool'))+(p.length?' ('+p.length+')':'')+'</h2>';
  if(!p.length)h+='<div class="none">'+esc(t('poolNone'))+'</div>';
  else{h+='<div class="none">'+esc(t('poolHint'))+'</div>';
    p.forEach(function(j){h+='<div class="it"><div class="t"><div class="l">📍 <b>'+esc(j.address||t('noAddr'))+'</b> · 🏗 '+esc(j.project||t('noProj'))+'</div>'
      +(j.timeline?'<div class="w" style="font-size:13px;color:var(--mute)">'+esc(t('tl'))+esc(j.timeline)+'</div>':'')+'</div>'
      +'<button type="button" class="pri" data-pj="'+esc(j.job_id)+'">'+esc(isMgr?t('schedule'):t('schedule'))+'</button></div>'})}
  $('pool').innerHTML=h;
  Array.prototype.forEach.call($('pool').querySelectorAll('[data-pj]'),function(b){b.onclick=function(){openForm(null,jobDefaults(b.getAttribute('data-pj'),sel))}})}
function renderGrid(){
  var r=gridRange(),h='';
  for(var i=0;i<7;i++)h+='<div class="dow'+(i>=5?' we':'')+'">'+esc(t('dow')[i])+'</div>';
  for(var k=0;k<42;k++){
    var d=iso(vy,vm,1-dow(vy,vm,1)+k),dd=+d.slice(8),inM=+d.slice(5,7)-1===vm,wd=k%7>=5,hn=holOf(d);
    var its=itemsOn(d),cls='cell'+(inM?'':' out')+(wd?' we':'')+(hn?' hol':'')+(d===TODAY?' today':'')+(d===sel?' sel':'');
    h+='<div class="'+cls+'" data-d="'+d+'"><span class="n">'+dd+'</span>'+(hn?'<div class="hn">'+esc(hn)+'</div>':'');
    its.slice(0,3).forEach(function(it){h+='<span class="chip '+(it.kind==='job'?'job':'me')+'">'+esc(chipText(it))+'</span>'});
    if(its.length>3)h+='<div class="more">+'+(its.length-3)+'</div>';
    if(its.length){h+='<div class="dots">';its.slice(0,6).forEach(function(it){h+='<i class="'+it.kind+'"></i>'});h+='</div>'}
    h+='</div>'}
  $('grid').innerHTML=h;
  Array.prototype.forEach.call($('grid').querySelectorAll('.cell'),function(c){c.onclick=function(){sel=c.getAttribute('data-d');render();$('day').scrollIntoView({behavior:'smooth',block:'nearest'})}})}
function dayTitle(d){
  var y=+d.slice(0,4),m=+d.slice(5,7),dn=+d.slice(8),w=dow(y,m-1,dn),hn=holOf(d);
  var wk=lang==='zh'?'周'+t('dow')[w]:t('dow')[w];
  var txt=lang==='zh'?y+'年'+m+'月'+dn+'日 '+wk:wk+' '+dn+' '+t('months')[m-1]+' '+y;
  return'<div class="dayh'+(w>=5||hn?' red':'')+'">'+esc(txt)+(hn?'<span class="hol-tag">'+esc(hn)+'</span>':w>=5?'<span class="hol-tag" style="background:#e57373">'+esc(t('weekend'))+'</span>':'')+'</div>'}
function evHtml(it){
  var h='<div class="ev '+it.kind+'">';
  if(it.kind==='job')h+='<div class="who" style="color:var(--deep)">'+esc(t('sched'))+(it.j.doc_no?' · '+esc(it.j.doc_no):'')+'</div>'+lineHtml(it)+'<div class="acts"><button type="button" data-aj="'+esc(it.j.job_id)+'">'+esc(t('addMine'))+'</button></div>';
  else{var e=it.e,mine=e.owner_email.toLowerCase()===me,canEdit=isMgr||e.created_by.toLowerCase()===me;
    h+='<div class="who">'+(isMgr||!mine?esc(e.owner_name||nameOf(e.owner_email)):esc(t('mine')))+(e.created_by.toLowerCase()!==e.owner_email.toLowerCase()?' · '+esc(t('byOffice')):'')+'</div>'+lineHtml(it)+(e.work?'<div class="w">'+esc(e.work)+'</div>':'')
      +(canEdit?'<div class="acts"><button type="button" data-ee="'+esc(e.id)+'">'+esc(t('edit'))+'</button></div>':'')}
  return h+'</div>'}
function bindEv(root){
  Array.prototype.forEach.call(root.querySelectorAll('[data-ee]'),function(b){b.onclick=function(){var e=entries.filter(function(x){return x.id===b.getAttribute('data-ee')})[0];if(e)openForm(e)}});
  Array.prototype.forEach.call(root.querySelectorAll('[data-aj]'),function(b){b.onclick=function(){openForm(null,jobDefaults(b.getAttribute('data-aj'),sel,true))}})}
function renderDay(){
  var its=itemsOn(sel),h=dayTitle(sel);
  if(!its.length)h+='<div class="msg">'+esc(t('noItems'))+'</div>';else its.forEach(function(it){h+=evHtml(it)});
  $('day').innerHTML=h;bindEv($('day'))}
function renderList(){
  var h='',last=iso(vy,vm+1,0),any=false;
  for(var d=iso(vy,vm,1);d<=last;d=iso(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8)+1)){
    var its=itemsOn(d),hn=holOf(d),w=dow(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8));
    if(!its.length&&!hn&&!(w>=5&&false))continue;any=true;
    h+='<section class="card">'+dayTitle(d);its.forEach(function(it){h+=evHtml(it)});h+='</section>'}
  if(!any)h='<div class="card msg">'+esc(t('noItems'))+'</div>';
  $('listWrap').innerHTML=h;bindEv($('listWrap'))}

/* ---------- entry form ---------- */
function jobDefaults(id,date,mineOnly){
  var j=jobs.filter(function(x){return x.job_id===id})[0];if(!j)return{};
  return{work_date:j.start_date||date,end_date:j.end_date||j.start_date||date,start_time:j.start_time,end_time:j.end_time,address:j.address,project:j.project,work:'',job_id:j.job_id}}
function openForm(e,def){
  editing=e;var d=e||def||{work_date:sel,end_date:sel};
  $('fT').textContent=t(e?'editT':'newT');
  ['fEmpL:emp','fDL:d','fEL:e','fSL:s','fTL:t','fAL:a','fPL:p','fWL:w'].forEach(function(x){var p=x.split(':');$(p[0]).textContent=t(p[1])});
  $('fSave').textContent=t('save');$('fCancel').textContent=t('cancel');$('fDel').textContent=t('del');$('fDel').hidden=!e;
  $('fD').value=d.work_date||sel;$('fE').value=(d.end_date&&d.end_date!==d.work_date)?d.end_date:'';$('fS').value=d.start_time||'';$('fT2').value=d.end_time||'';
  $('fA').value=d.address||'';$('fP').value=d.project||'';$('fW').value=d.work||'';$('fMsg').textContent='';
  var w=$('fEmpW');w.hidden=!isMgr;
  if(isMgr){var s=$('fEmp'),seen={},o='';
    function opt(em,nm){em=em.toLowerCase();if(seen[em])return;seen[em]=1;o+='<option value="'+esc(em)+'">'+esc(nm||em)+'</option>'}
    opt(me,myName||me);staff.forEach(function(x){opt(x.email,x.name)});if(e)opt(e.owner_email,e.owner_name);
    s.innerHTML=o;s.value=e?e.owner_email.toLowerCase():($('emp').value||me)}
  editing=e;editing_def=d;$('modal').hidden=false;$('fD').focus()}
var editing_def=null;
function closeForm(){$('modal').hidden=true}
async function saveForm(ev){
  ev.preventDefault();var fm=$('fMsg');fm.textContent='';
  var d=$('fD').value,e=$('fE').value||d;
  if(!d){fm.textContent=t('needDate');return}if(e<d){fm.textContent=t('endBefore');return}
  var owner=isMgr?$('fEmp').value.toLowerCase():me,oname=owner===me?myName:nameOf(owner);
  var row={owner_email:owner,owner_name:oname,work_date:d,end_date:e,start_time:$('fS').value,end_time:$('fT2').value,address:$('fA').value.trim(),project:$('fP').value.trim(),work:$('fW').value.trim()};
  var btn=$('fSave');btn.disabled=true;
  try{
    if(editing)await sb('/rest/v1/ye_sched_entries?id=eq.'+encodeURIComponent(editing.id),{method:'PATCH',body:JSON.stringify(row),prefer:'return=minimal'});
    else{row.created_by=me;if(editing_def&&editing_def.job_id)row.job_id=editing_def.job_id;await sb('/rest/v1/ye_sched_entries',{method:'POST',body:JSON.stringify(row),prefer:'return=minimal'})}
    closeForm();sel=d;var y=+d.slice(0,4),m=+d.slice(5,7)-1;if(y!==vy||m!==vm){vy=y;vm=m}
    await loadEntries();render()
  }catch(er){fm.textContent=t('saveFail')+netMsg(er)}
  btn.disabled=false}
async function delForm(){
  if(!editing||!confirm(t('delQ')))return;
  try{await sb('/rest/v1/ye_sched_entries?id=eq.'+encodeURIComponent(editing.id),{method:'DELETE'});closeForm();await loadEntries();render()}
  catch(er){$('fMsg').textContent=t('saveFail')+netMsg(er)}}

/* ---------- wiring ---------- */
function shift(n){vm+=n;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}reload()}
async function reload(){try{await loadEntries()}catch(e){say(t('loadFail')+netMsg(e),true)}render()}
$('prev').onclick=function(){shift(-1)};$('next').onclick=function(){shift(1)};
$('today').onclick=function(){vy=+TODAY.slice(0,4);vm=+TODAY.slice(5,7)-1;sel=TODAY;reload()};
$('add').onclick=function(){openForm(null)};
$('vGrid').onclick=function(){mode='grid';lsSet('ye_sched_mode',mode);render()};$('vList').onclick=function(){mode='list';lsSet('ye_sched_mode',mode);render()};
$('lang').onclick=function(){lang=lang==='zh'?'en':'zh';lsSet('ye_sched_lang',lang);render()};
$('emp').onchange=render;
$('form').onsubmit=saveForm;$('fCancel').onclick=closeForm;$('fDel').onclick=delForm;
$('modal').addEventListener('mousedown',function(e){if(e.target===$('modal'))closeForm()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('modal').hidden)closeForm()});

async function boot(){
  render();
  if(!ses){say('Please sign in from the home page. 请先在主页登录。',true);return}
  say(t('loading'));
  try{
    await loadStaff();
    if(isMgr){try{var n=await syncJobs();}catch(e){say(t('syncFail')+netMsg(e),true);var failed=true}}
    await Promise.all([loadJobs(),loadEntries()]);
    if(!failed)say(isMgr?t('synced')+jobs.length:(jobsStamp?t('jobsAt')+new Date(jobsStamp).toLocaleString(lang==='zh'?'zh-CN':'en-NZ',{timeZone:'Pacific/Auckland',dateStyle:'medium',timeStyle:'short'}):''));
  }catch(e){say(t('loadFail')+netMsg(e),true)}
  render()}
boot();
/* expose pure helpers for the test page */
window.__sched={holidays:holidays,parseTimeline:parseTimeline};
})();
</script>
