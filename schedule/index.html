<title>Schedule · 日程表 · YE Construction</title>

<style>
:root{--blue:#356db7;--deep:#24477f;--sky:#62a0db;--ink:#172033;--mute:#5d6b82;--line:#d8dee9;--bg:#eef3fa;--paper:#fff;
  --red:#c62828;--redbg:#fdeeee;--redbg2:#f8d3d3;--green:#1c7a55;--greenbg:#e4f4ec;--amber:#a85d00;--amberbg:#fff3df;--jobbg:#e3ecf9}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Arial,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.4}
.top{height:6px;background:linear-gradient(90deg,var(--deep) 0 34%,var(--blue) 34% 67%,var(--sky) 67%)}
main{max-width:1120px;margin:0 auto;padding:14px 12px calc(40px + env(safe-area-inset-bottom))}
.hero{display:flex;align-items:center;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.hero img{width:190px;height:auto;flex:none;display:block}
.hero .tx{min-width:0;border-left:3px solid var(--sky);padding-left:16px}
.hero h1{font-size:22px;margin:0;color:var(--deep);letter-spacing:.01em}
.hero p{margin:3px 0 0;font-size:13px;color:var(--mute)}
.tools{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:12px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools .sp{flex:1}
.nav{display:flex;align-items:center;gap:6px}
.month{font-size:20px;font-weight:700;color:var(--deep);min-width:170px;text-align:center}
button,select,input,textarea{font:inherit;font-size:15px}
button{min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--deep);font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:hover{background:#e8eef7}button:active{transform:translateY(1px)}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}button.pri:hover{background:var(--deep)}
button.dng{color:var(--red);border-color:#efc4c4}
button.sm{min-height:34px;font-size:13px;padding:0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:40px}
.seg button.on{background:var(--deep);color:#fff}
select{min-height:42px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);max-width:100%}
.msg{font-size:13px;color:var(--mute);min-height:18px;margin:0 4px 8px}.msg.bad{color:var(--red)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 6px;color:var(--deep)}
/* to-schedule pool */
.pool{border-color:#f0d6a8;background:linear-gradient(0deg,#fff,#fffaf0)}
.pool h2{color:var(--amber);display:flex;gap:8px;align-items:center}
.pool h2 b{background:var(--amber);color:#fff;border-radius:999px;font-size:12px;padding:1px 9px}
.pool .hint{font-size:13px;color:var(--mute);margin-bottom:4px}
.pool .it{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px dashed #e8d3ae;padding:10px 0}
.pool .t{min-width:0}
.pool .tl{font-size:13px;color:var(--mute);margin-top:2px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:1px;background:var(--greenbg);color:var(--green)}
.badge.warn{background:var(--amberbg);color:var(--amber)}
/* month grid */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper);box-shadow:0 2px 10px rgba(36,71,127,.06)}
.dow{background:var(--deep);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:9px 0}
.dow.we{background:var(--red)}
.cell{min-height:118px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:5px;cursor:pointer;position:relative;overflow:hidden;background:var(--paper);transition:background .12s}
.cell:nth-child(7n+8){border-left:0}
.cell:hover{background:#f3f7fd}
.cell.out{background:#f4f6f9}.cell.out>*{opacity:.5}
.cell.we{background:var(--redbg)}
.cell.hol{background:var(--redbg2)}
.cell.we .n,.cell.hol .n{color:var(--red)}
.cell.today .n{background:var(--blue);color:#fff!important;border-radius:50%}
.cell.sel{box-shadow:inset 0 0 0 3px var(--sky)}
.n{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;font-size:14px;font-weight:700}
.hn{font-size:11px;font-weight:700;color:var(--red);line-height:1.25;margin:1px 0 3px;word-break:break-word}
.chip{display:block;font-size:11.5px;line-height:1.3;padding:3px 6px;margin:2px 0;border-radius:6px;border-left:3px solid var(--green);background:var(--greenbg);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.job{border-left-color:var(--deep);background:var(--jobbg)}
.more{font-size:11px;color:var(--mute);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--green);display:block}
.dots i.job{background:var(--deep)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:10px 4px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px;background:var(--c);border:1px solid var(--line)}
.hlist{margin:0;padding:0;list-style:none}
.hlist li{display:flex;gap:10px;padding:5px 0;border-top:1px solid #f0e0e0;font-size:14px}
.hlist li:first-child{border-top:0}
.hlist .d{color:var(--red);font-weight:700;min-width:96px}
/* events */
.dayh{font-size:17px;font-weight:700;color:var(--deep);margin:0 0 6px}
.dayh.red{color:var(--red)}
.tag{display:inline-block;background:var(--red);color:#fff;border-radius:999px;font-size:12px;padding:1px 10px;margin-left:8px;vertical-align:2px;font-weight:700}
.tag.we{background:#e57373}
.ev{border-left:5px solid var(--green);background:#fbfdfc;border-radius:10px;padding:10px 12px;margin:8px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ev.job{border-left-color:var(--deep);background:#fafcff}
.ev .who{font-size:12px;font-weight:700;color:var(--green);letter-spacing:.02em;margin-bottom:2px}
.ev.job .who{color:var(--deep)}
.ev .l{font-size:15.5px;line-height:1.6;word-break:break-word}
.ev .l b{color:var(--deep)}
.ev .w{font-size:14px;color:#374559;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.ev .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal[hidden]{display:none}
.box{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:18px 18px 16px;margin:auto;box-shadow:0 20px 50px rgba(10,20,40,.35)}
.box h2{margin:0 0 4px;color:var(--deep);font-size:19px}
.box .jobnote{font-size:13px;color:var(--mute);margin-bottom:4px}
.box label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:12px 0 4px}
.box input,.box textarea,.box select{width:100%;padding:10px 11px;border:1px solid #c5cfdd;border-radius:10px;color:var(--ink);background:#fff;font-size:16px}
.box input:focus,.box textarea:focus,.box select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(53,109,183,.22)}
.box textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box .acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.box .acts #fDel{margin-right:auto}
@media(max-width:700px){
  main{padding:10px 8px 40px}
  .hero{padding:10px 12px;gap:12px}.hero img{width:104px}.hero .tx{padding-left:12px}.hero h1{font-size:18px}.hero p{font-size:12px}
  .tools{padding:8px}.nav{width:100%}.month{flex:1;min-width:0;font-size:18px}
  .tools .sp{display:none}
  .tools>*{flex:1 1 auto}.tools .nav,.tools .nav>*{flex:initial}.nav .month{flex:1}
  .cell{min-height:70px;padding:3px 2px;text-align:center}
  .chip,.more,.hn{display:none}.dots{display:flex}
  .n{min-width:24px;height:24px;line-height:24px;font-size:14px}
  .cell.hol::after{content:"";position:absolute;left:50%;top:5px;margin-left:11px;width:6px;height:6px;border-radius:50%;background:var(--red)}
  .dow{font-size:12px;padding:7px 0}
  .card{padding:12px;border-radius:14px}
  .pool .it{flex-direction:column;align-items:stretch}.pool .it button{width:100%}
  .hlist .d{min-width:84px}
  .modal{align-items:flex-end;padding:0}
  .box{border-radius:18px 18px 0 0;max-width:none;margin:0;max-height:94vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.top,.tools,.pool,.legend,#yeNav,.acts{display:none!important}body{background:#fff}}
</style>

  else if(rg==='otago'){var od=iso(y,2,nearMon(y,2,23));if(od===em)od=iso(y,2,nearMon(y,2,23)+1);put(od,'Otago Anniversary Day','奥塔哥周年纪念日')}
  else if(rg==='southland')put(iso(y,e[0],e[1]+2),'Southland Anniversary Day','南地周年纪念日');
  else if(rg==='taranaki')put(iso(y,2,nthDow(y,2,0,2)),'Taranaki Anniversary Day','塔拉纳基周年纪念日');
  else if(rg==='hawkesbay')put(iso(y,9,lab-3),"Hawke's Bay Anniversary Day",'霍克湾周年纪念日');
  else if(rg==='marlborough')put(iso(y,9,lab+7),'Marlborough Anniversary Day','马尔堡周年纪念日');
  else if(rg==='southcanterbury')put(iso(y,8,nthDow(y,8,0,4)),'South Canterbury Anniversary Day','南坎特伯雷周年纪念日');
  else if(rg==='canterbury')put(iso(y,10,nthDow(y,10,1,1)+10),'Canterbury Show Day','坎特伯雷展览日');
  else if(rg==='westland')put(iso(y,11,nearMon(y,11,1)),'Westland Anniversary Day','西海岸周年纪念日');
  else if(rg==='chatham')put(iso(y,10,nearMon(y,10,30)),'Chatham Islands Anniversary Day','查塔姆群岛周年纪念日');
  return holCache[ck]=H}
function holOf(date){var h=holidays(+date.slice(0,4),region)[date];return h?h[lang]:''}

/* ---------- session / api ---------- */
var ses=lsGet(SESKEY),gate=lsGet('ye_gate_ok')||{},me=(ses&&ses.email||'').toLowerCase(),isMgr=gate.role==='manager',myName='';
function jwtPart(tk){try{return JSON.parse(decodeURIComponent(escape(atob(tk.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){return{}}}
function toSes(j,old){return{access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,email:(j.user&&j.user.email)||(old&&old.email)||'',uid:(j.user&&j.user.id)||jwtPart(j.access_token).sub||(old&&old.uid)||''}}
async function errOf(r){var m='';try{var j=await r.json();m=j.msg||j.message||j.error_description||j.error||''}catch(e){}var er=new Error((m||'Request failed')+' ('+r.status+')');er.status=r.status;return er}
async function refreshSes(force){
  var o=lsGet(SESKEY);if(o&&o.refresh_token&&ses&&o.refresh_token!==ses.refresh_token){ses=o;force=false}
  if(!force&&ses.exp-Date.now()>120000)return;
  var r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SBK,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:ses.refresh_token})});
  if(!r.ok){if([400,401,403].indexOf(r.status)>=0){lsSet(SESKEY,null);throw new Error('Sign-in expired. 登录已过期。')}throw await errOf(r)}
  ses=toSes(await r.json(),ses);lsSet(SESKEY,ses)}
async function sb(path,opt,retried){
  opt=opt||{};if(!ses)throw new Error('Not signed in');await refreshSes();
  var h={apikey:SBK,Authorization:'Bearer '+ses.access_token};if(opt.body)h['Content-Type']='application/json';if(opt.prefer)h.Prefer=opt.prefer;
  var r=await fetch(SB+path,{method:opt.method||'GET',headers:h,body:opt.body,cache:'no-store'});
  if(r.status===401&&!retried){await refreshSes(true);return sb(path,opt,true)}
  if(!r.ok)throw await errOf(r);var tx=await r.text();return tx?JSON.parse(tx):null}
function netMsg(e){if(e instanceof TypeError)return t('offline');if(/ye_sched|relation|schema cache|does not exist/i.test(e.message))return t('setupHint');return e.message}
function say(s,bad){var m=$('msg');m.textContent=s||'';m.className='msg'+(bad?' bad':'')}

/* ---------- state ---------- */
var mode=lsGet('ye_sched_mode')==='list'?'list':'grid';
function nzToday(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Pacific/Auckland'}).format(new Date())}catch(e){var n=new Date();return iso(n.getFullYear(),n.getMonth(),n.getDate())}}
var TODAY=nzToday(),vy=+TODAY.slice(0,4),vm=+TODAY.slice(5,7)-1,sel=TODAY;
var jobs=[],entries=[],jobEntries=[],staff=[],editing=null,editDef=null;

function gridRange(){var first=dow(vy,vm,1);return{s:iso(vy,vm,1-first),e:iso(vy,vm,1-first+41)}}
async function loadEntries(){
  var r=gridRange();
  entries=await sb('/rest/v1/ye_sched_entries?select=*&work_date=lte.'+r.e+'&end_date=gte.'+r.s+'&order=work_date.asc,start_time.asc&limit=2000')||[]}
async function loadJobs(){
  jobs=await sb('/rest/v1/ye_sched_jobs?select=*&order=start_date.asc.nullsfirst&limit=1000')||[];
  try{jobEntries=await sb('/rest/v1/ye_sched_entries?select=job_id,owner_email&job_id=not.is.null&limit=5000')||[]}catch(e){jobEntries=[]}}
async function syncJobs(){
  /* office only: reconcile ye_sched_jobs with the signed / paid quotes in the company records (no prices are copied) */
  var q='/rest/v1/ye_records?select=id,type:data-%3E%3Etype,status:data-%3E%3Estatus,no:data-%3E%3Eno,client:data-%3E%3Eclient,project:data-%3E%3Eproject,name:data-%3E%3Ename,assignees:data-%3Eassignees,casuals:data-%3Ecasuals,loc:data-%3Edata-%3Efields-%3E%3EprojectLocation,addr:data-%3Edata-%3Efields-%3E%3EclientAddress,pn:data-%3Edata-%3Efields-%3E%3EprojectName,tl:data-%3Edata-%3Efields-%3E%3Etimeline&kind=eq.job&deleted=is.false&data-%3E%3Etype=eq.quote&data-%3E%3Estatus=in.(signed,paid)&limit=2000';
  var a=await sb(q)||[];
  var rows=a.map(function(x){return YESched.rowFrom(x)});
  await YESched.push(rows,rows.map(function(r){return r.job_id}),function(p,o){return sb(p,o)});
  return rows.length}
async function loadStaff(){
  try{var a=await sb('/rest/v1/ye_staff?select=email,name&order=email')||[];staff=a.map(function(s){return{email:(s.email||'').toLowerCase(),name:s.name||''}});
    var mine=staff.filter(function(s){return s.email===me})[0];if(mine&&mine.name)myName=mine.name}catch(e){}
  if(!myName)myName=me.split('@')[0]}
function nameOf(email){email=(email||'').toLowerCase();var s=staff.filter(function(x){return x.email===email})[0];return(s&&s.name)||email.split('@')[0]}

/* ---------- item helpers ---------- */
function timeStr(st,en){return st?(en?st+'–'+en:st):t('tbc')}
function itemsOn(date){
  var out=[];
  jobs.forEach(function(j){if(j.start_date&&j.start_date<=date&&date<=(j.end_date||j.start_date))out.push({kind:'job',j:j,st:j.start_time||'',en:j.end_time||'',address:j.address,project:j.project,work:''})});
  var f=$('emp').value;
  entries.forEach(function(e){if(e.work_date<=date&&date<=e.end_date){if(isMgr&&f&&e.owner_email.toLowerCase()!==f)return;out.push({kind:'entry',e:e,st:e.start_time,en:e.end_time,address:e.address,project:e.project,work:e.work})}});
  out.sort(function(a,b){return(a.kind===b.kind?0:a.kind==='job'?-1:1)||((a.st||'99')<(b.st||'99')?-1:(a.st||'99')>(b.st||'99')?1:0)});
  return out}
function pool(){return jobs.filter(function(j){return !j.start_date})}
function lineHtml(it){return'<div class="l">📍 <b>'+esc(it.address||t('noAddr'))+'</b> · 🏗 '+esc(it.project||t('noProj'))+' · 🕐 '+esc(timeStr(it.st,it.en))+'</div>'}
function chipText(it){return(it.st?it.st+' ':'')+(it.address||it.project||it.work||'')}
function workersOf(j){var a=(j.assignees||[]).map(nameOf).concat((j.casuals||[]).map(function(c){return c+(lang==='zh'?'（临时）':' (casual)')}));return a.join(', ')}

/* ---------- render ---------- */
function render(){
  $('ttl').textContent=t('ttl');$('sub').textContent=t('sub');$('today').textContent=t('today');$('add').textContent=t('add');
  $('vGrid').textContent=t('grid');$('vList').textContent=t('list');$('lang').textContent=t('langBtn');
  $('vGrid').className=mode==='grid'?'on':'';$('vList').className=mode==='list'?'on':'';
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  $('mlabel').textContent=lang==='zh'?vy+'年 '+t('months')[vm]:t('months')[vm]+' '+vy;
  $('region').innerHTML=REGIONS.map(function(r){return'<option value="'+r[0]+'"'+(r[0]===region?' selected':'')+'>'+esc((lang==='zh'?'地区：':'Region: ')+(lang==='zh'?r[2]:r[1]))+'</option>'}).join('');
  $('legend').innerHTML='<span style="--c:#f8d3d3">'+t('legHol')+'</span><span style="--c:#fdeeee">'+t('legWe')+'</span><span style="--c:#e3ecf9">'+t('legJob')+'</span><span style="--c:#e4f4ec">'+t('legMine')+'</span>';
  renderEmp();renderPool();
  $('gridWrap').hidden=mode!=='grid';$('listWrap').hidden=mode!=='list';
  if(mode==='grid')renderGrid();else renderList();
  renderDay();renderHols()}
function renderEmp(){
  var s=$('emp');if(!isMgr){s.hidden=true;return}
  var cur=s.value,seen={},opts='<option value="">'+esc(t('allEmp'))+'</option>';
  staff.forEach(function(x){seen[x.email]=1;opts+='<option value="'+esc(x.email)+'">'+esc(x.name||x.email)+'</option>'});
  entries.forEach(function(e){var k=e.owner_email.toLowerCase();if(!seen[k]){seen[k]=1;opts+='<option value="'+esc(k)+'">'+esc(e.owner_name||k)+'</option>'}});
  if(!seen[me])opts+='<option value="'+esc(me)+'">'+esc(myName||me)+'</option>';
  s.innerHTML=opts;s.value=cur;s.hidden=false}
function renderPool(){
  var p=pool(),el=$('pool');
  if(!p.length){el.hidden=true;el.innerHTML='';return}
  el.hidden=false;
  var h='<h2>'+esc(t('pool'))+' <b>'+p.length+'</b></h2><div class="hint">'+esc(t('poolHint'))+'</div>';
  p.forEach(function(j){
    var n=jobEntries.filter(function(x){return x.job_id===j.job_id}).length,w=workersOf(j);
    h+='<div class="it"><div class="t"><div class="l">📍 <b>'+esc(j.address||t('noAddr'))+'</b> · 🏗 '+esc(j.project||t('noProj'))
      +(n?'<span class="badge">✓ '+n+' '+esc(t('done'))+'</span>':'')+'</div>'
      +(j.timeline?'<div class="tl">'+esc(t('tl'))+esc(j.timeline)+'</div>':'')
      +(isMgr?'<div class="tl">👷 '+(w?esc(w):'<span class="badge warn" style="margin:0">'+esc(t('unassigned'))+'</span>')+'</div>':'')+'</div>'
      +'<button type="button" class="pri" data-pj="'+esc(j.job_id)+'">'+esc(n?t('again'):t('schedule'))+'</button></div>'});
  el.innerHTML=h;
  Array.prototype.forEach.call(el.querySelectorAll('[data-pj]'),function(b){b.onclick=function(){openForm(null,jobDefaults(b.getAttribute('data-pj'),sel))}})}
function renderGrid(){
  var h='';
  for(var i=0;i<7;i++)h+='<div class="dow'+(i>=5?' we':'')+'">'+esc(t('dow')[i])+'</div>';
  for(var k=0;k<42;k++){
    var d=iso(vy,vm,1-dow(vy,vm,1)+k),dd=+d.slice(8),inM=+d.slice(5,7)-1===vm,wd=k%7>=5,hn=holOf(d);
    var its=itemsOn(d),cls='cell'+(inM?'':' out')+(wd?' we':'')+(hn?' hol':'')+(d===TODAY?' today':'')+(d===sel?' sel':'');
    h+='<div class="'+cls+'" data-d="'+d+'" role="button" tabindex="0"><span class="n">'+dd+'</span>'+(hn?'<div class="hn">'+esc(hn)+'</div>':'');
    its.slice(0,3).forEach(function(it){h+='<span class="chip '+(it.kind==='job'?'job':'')+'">'+esc(chipText(it))+'</span>'});
    if(its.length>3)h+='<div class="more">+'+(its.length-3)+'</div>';
    if(its.length){h+='<div class="dots">';its.slice(0,6).forEach(function(it){h+='<i class="'+it.kind+'"></i>'});h+='</div>'}
    h+='</div>'}
  $('grid').innerHTML=h;
  Array.prototype.forEach.call($('grid').querySelectorAll('.cell'),function(c){
    function go(){sel=c.getAttribute('data-d');render();var el=$('day');if(el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'nearest'})}
    c.onclick=go;c.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}})}
function dayTitle(d){
  var y=+d.slice(0,4),m=+d.slice(5,7),dn=+d.slice(8),w=dow(y,m-1,dn),hn=holOf(d);
  var wk=lang==='zh'?'周'+t('dow')[w]:t('dow')[w];
  var txt=lang==='zh'?y+'年'+m+'月'+dn+'日 '+wk:wk+' '+dn+' '+t('months')[m-1]+' '+y;
  return'<div class="dayh'+(w>=5||hn?' red':'')+'">'+esc(txt)+(hn?'<span class="tag">'+esc(hn)+'</span>':w>=5?'<span class="tag we">'+esc(t('weekend'))+'</span>':'')+'</div>'}
function evHtml(it){
  var h='<div class="ev '+it.kind+'">';
  if(it.kind==='job'){var w=workersOf(it.j);h+='<div class="who">'+esc(t('jobTag'))+(it.j.doc_no?' · '+esc(it.j.doc_no):'')+'</div>'+lineHtml(it)+(isMgr?'<div class="w">👷 '+(w?esc(w):esc(t('unassigned')))+'</div>':'')}
  else{var e=it.e,mine=e.owner_email.toLowerCase()===me,canEdit=isMgr||e.created_by.toLowerCase()===me;
    h+='<div class="who">'+(isMgr||!mine?esc(e.owner_name||nameOf(e.owner_email)):esc(t('mine')))+(e.created_by.toLowerCase()!==e.owner_email.toLowerCase()?' · '+esc(t('byOffice')):'')+'</div>'+lineHtml(it)+(e.work?'<div class="w">'+esc(e.work)+'</div>':'')
      +(canEdit?'<div class="acts"><button type="button" class="sm" data-ee="'+esc(e.id)+'">'+esc(t('edit'))+'</button></div>':'')}
  return h+'</div>'}
function bindEv(root){Array.prototype.forEach.call(root.querySelectorAll('[data-ee]'),function(b){b.onclick=function(){var e=entries.filter(function(x){return x.id===b.getAttribute('data-ee')})[0];if(e)openForm(e)}})}
function renderDay(){
  var its=itemsOn(sel),h=dayTitle(sel);
  if(!its.length)h+='<div class="msg">'+esc(!isMgr&&!jobs.length&&!entries.length?t('noJobs'):t('noItems'))+'</div>';else its.forEach(function(it){h+=evHtml(it)});
  $('day').innerHTML=h;bindEv($('day'))}
function renderHols(){
  var last=iso(vy,vm+1,0),h='<h2>'+esc(t('holTitle'))+'</h2>',n=0,H=holidays(vy,region);
  for(var d=iso(vy,vm,1);d<=last;d=iso(vy,vm,+d.slice(8)+1)){var o=H[d];if(!o)continue;n++;
    var w=dow(vy,vm,+d.slice(8)),day=lang==='zh'?(vm+1)+'月'+(+d.slice(8))+'日 周'+t('dow')[w]:t('dow')[w]+' '+(+d.slice(8))+' '+t('months')[vm].slice(0,3);
    h+=(n===1?'<ul class="hlist">':'')+'<li><span class="d">'+esc(day)+'</span><span>'+esc(o[lang])+'</span></li>'}
  h+=n?'</ul>':'<div class="msg">'+esc(t('noHol'))+'</div>';
  $('hols').innerHTML=h}
function renderList(){
  var h='',last=iso(vy,vm+1,0),any=false;
  for(var d=iso(vy,vm,1);d<=last;d=iso(vy,vm,+d.slice(8)+1)){
    var its=itemsOn(d);if(!its.length&&!holOf(d))continue;any=true;
    h+='<section class="card">'+dayTitle(d);its.forEach(function(it){h+=evHtml(it)});h+='</section>'}
  if(!any)h='<div class="card msg">'+esc(t('noItems'))+'</div>';
  $('listWrap').innerHTML=h;bindEv($('listWrap'))}

/* ---------- entry form ---------- */
function jobDefaults(id,date){
  var j=jobs.filter(function(x){return x.job_id===id})[0];if(!j)return{};
  return{work_date:j.start_date||date,end_date:j.end_date||j.start_date||date,start_time:j.start_time,end_time:j.end_time,address:j.address,project:j.project,work:'',job_id:j.job_id,owner:(j.assignees||[])[0]||'',jobName:(j.doc_no?j.doc_no+' · ':'')+(j.project||j.address||'')}}
function openForm(e,def){
  editing=e;var d=e||def||{work_date:sel,end_date:sel};editDef=d;
  $('fT').textContent=t(e?'editT':'newT');
  var jn=$('fJob');jn.hidden=!d.jobName;jn.textContent=d.jobName?t('jobFor')+d.jobName:'';
  [['fEmpL','emp'],['fDL','d'],['fEL','e'],['fSL','s'],['fTL','t'],['fAL','a'],['fPL','p'],['fWL','w']].forEach(function(x){$(x[0]).textContent=t(x[1])});
  $('fSave').textContent=t('save');$('fCancel').textContent=t('cancel');$('fDel').textContent=t('del');$('fDel').hidden=!e;
  $('fD').value=d.work_date||sel;$('fE').value=(d.end_date&&d.end_date!==d.work_date)?d.end_date:'';$('fS').value=d.start_time||'';$('fT2').value=d.end_time||'';
  $('fA').value=d.address||'';$('fP').value=d.project||'';$('fW').value=d.work||'';$('fMsg').textContent='';
  $('fEmpW').hidden=!isMgr;
  if(isMgr){var s=$('fEmp'),seen={},o='';
    var opt=function(em,nm){em=em.toLowerCase();if(!em||seen[em])return;seen[em]=1;o+='<option value="'+esc(em)+'">'+esc(nm||em)+'</option>'};
    opt(me,myName||me);staff.forEach(function(x){opt(x.email,x.name)});if(e)opt(e.owner_email,e.owner_name);if(d.owner)opt(d.owner,nameOf(d.owner));
    s.innerHTML=o;s.value=e?e.owner_email.toLowerCase():(d.owner||$('emp').value||me)}
  $('modal').hidden=false;$('fD').focus()}
function closeForm(){$('modal').hidden=true}
async function saveForm(ev){
  ev.preventDefault();var fm=$('fMsg');fm.textContent='';
  var d=$('fD').value,e=$('fE').value||d;
  if(!d){fm.textContent=t('needDate');return}if(e<d){fm.textContent=t('endBefore');return}
  var owner=isMgr?$('fEmp').value.toLowerCase():me,oname=owner===me?myName:nameOf(owner);
  var row={owner_email:owner,owner_name:oname,work_date:d,end_date:e,start_time:$('fS').value,end_time:$('fT2').value,address:$('fA').value.trim(),project:$('fP').value.trim(),work:$('fW').value.trim()};
  var btn=$('fSave');btn.disabled=true;
  try{
    if(editing)await sb('/rest/v1/ye_sched_entries?id=eq.'+encodeURIComponent(editing.id),{method:'PATCH',body:JSON.stringify(row),prefer:'return=minimal'});
    else{row.created_by=me;if(editDef&&editDef.job_id)row.job_id=editDef.job_id;await sb('/rest/v1/ye_sched_entries',{method:'POST',body:JSON.stringify(row),prefer:'return=minimal'})}
    closeForm();sel=d;vy=+d.slice(0,4);vm=+d.slice(5,7)-1;
    await Promise.all([loadEntries(),loadJobs()]);render()
  }catch(er){fm.textContent=t('saveFail')+netMsg(er)}
  btn.disabled=false}
async function delForm(){
  if(!editing||!confirm(t('delQ')))return;
  try{await sb('/rest/v1/ye_sched_entries?id=eq.'+encodeURIComponent(editing.id),{method:'DELETE'});closeForm();await Promise.all([loadEntries(),loadJobs()]);render()}
  catch(er){$('fMsg').textContent=t('saveFail')+netMsg(er)}}

/* ---------- wiring ---------- */
function shift(n){vm+=n;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}reload()}
async function reload(){try{await loadEntries()}catch(e){say(t('loadFail')+netMsg(e),true)}render()}
$('prev').onclick=function(){shift(-1)};$('next').onclick=function(){shift(1)};
$('today').onclick=function(){vy=+TODAY.slice(0,4);vm=+TODAY.slice(5,7)-1;sel=TODAY;reload()};
$('add').onclick=function(){openForm(null)};
$('vGrid').onclick=function(){mode='grid';lsSet('ye_sched_mode',mode);render()};$('vList').onclick=function(){mode='list';lsSet('ye_sched_mode',mode);render()};
$('lang').onclick=function(){lang=lang==='zh'?'en':'zh';lsSet('ye_sched_lang',lang);render()};
$('region').onchange=function(){region=$('region').value;lsSet('ye_sched_region',region);render()};
$('emp').onchange=render;
$('form').onsubmit=saveForm;$('fCancel').onclick=closeForm;$('fDel').onclick=delForm;
$('modal').addEventListener('mousedown',function(e){if(e.target===$('modal'))closeForm()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('modal').hidden)closeForm()});

async function boot(){
  render();
  if(!ses){say('Please sign in from the home page. 请先在主页登录。',true);return}
  say(t('loading'));
  var failed=false;
  try{
    await loadStaff();
    if(isMgr){try{await syncJobs()}catch(e){say(t('syncFail')+netMsg(e),true);failed=true}}
    await Promise.all([loadJobs(),loadEntries()]);
    if(!failed)say('');
  }catch(e){say(t('loadFail')+netMsg(e),true)}
  render()}
boot();
window.__sched={holidays:holidays};
})();
</script>
