<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script src="../assets/gate.js" data-need="staff" data-app="Schedule · 日程表"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24477f">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<title>Schedule · 日程表 · YE Construction</title>
<script src="../assets/sched-lib.js"></script>
<style>
:root{--blue:#356db7;--deep:#24477f;--sky:#62a0db;--ink:#172033;--mute:#5d6b82;--line:#d8dee9;--bg:#eef3fa;--paper:#fff;
  --red:#c62828;--redbg:#fdeeee;--redbg2:#f8d3d3;--green:#1c7a55;--greenbg:#e4f4ec;--amber:#a85d00;--amberbg:#fff3df;--jobbg:#e3ecf9}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Arial,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.4}
.top{height:6px;background:linear-gradient(90deg,var(--deep) 0 34%,var(--blue) 34% 67%,var(--sky) 67%)}
main{max-width:1120px;margin:0 auto;padding:14px 12px calc(40px + env(safe-area-inset-bottom))}
.hero{display:flex;align-items:center;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.hero img{width:190px;height:auto;flex:none;display:block}
.hero .tx{min-width:0;border-left:3px solid var(--sky);padding-left:16px}
.hero h1{font-size:22px;margin:0;color:var(--deep);letter-spacing:.01em}
.hero p{margin:3px 0 0;font-size:13px;color:var(--mute)}
.tools{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:12px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools .sp{flex:1}
.nav{display:flex;align-items:center;gap:6px}
.month{font-size:20px;font-weight:700;color:var(--deep);min-width:170px;text-align:center}
button,select,input,textarea{font:inherit;font-size:15px}
button{min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--deep);font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:hover{background:#e8eef7}button:active{transform:translateY(1px)}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}button.pri:hover{background:var(--deep)}
button.dng{color:var(--red);border-color:#efc4c4}
button.sm{min-height:34px;font-size:13px;padding:0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:40px}
.seg button.on{background:var(--deep);color:#fff}
select{min-height:42px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);max-width:100%}
.msg{font-size:13px;color:var(--mute);min-height:18px;margin:0 4px 8px}.msg.bad{color:var(--red)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 6px;color:var(--deep)}
/* to-schedule pool */
.pool{border-color:#f0d6a8;background:linear-gradient(0deg,#fff,#fffaf0)}
.pool h2{color:var(--amber);display:flex;gap:8px;align-items:center}
.pool h2 b{background:var(--amber);color:#fff;border-radius:999px;font-size:12px;padding:1px 9px}
.pool .hint{font-size:13px;color:var(--mute);margin-bottom:4px}
.pool .it{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px dashed #e8d3ae;padding:10px 0}
.pool .t{min-width:0}
.pool .tl{font-size:13px;color:var(--mute);margin-top:2px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:1px;background:var(--greenbg);color:var(--green)}
.badge.warn{background:var(--amberbg);color:var(--amber)}
/* month grid */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper);box-shadow:0 2px 10px rgba(36,71,127,.06)}
.dow{background:var(--deep);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:9px 0}
.dow.we{background:var(--red)}
.cell{min-height:118px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:5px;cursor:pointer;position:relative;overflow:hidden;background:var(--paper);transition:background .12s}
.cell:nth-child(7n+8){border-left:0}
.cell:hover{background:#f3f7fd}
.cell.out{background:#f4f6f9}.cell.out>*{opacity:.5}
.cell.we{background:var(--redbg)}
.cell.hol{background:var(--redbg2)}
.cell.we .n,.cell.hol .n{color:var(--red)}
.cell.today .n{background:var(--blue);color:#fff!important;border-radius:50%}
.cell.sel{box-shadow:inset 0 0 0 3px var(--sky)}
.n{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;font-size:14px;font-weight:700}
.hn{font-size:11px;font-weight:700;color:var(--red);line-height:1.25;margin:1px 0 3px;word-break:break-word}
.chip{display:block;font-size:11.5px;line-height:1.3;padding:3px 6px;margin:2px 0;border-radius:6px;border-left:3px solid var(--green);background:var(--greenbg);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.job{border-left-color:var(--deep);background:var(--jobbg)}
.more{font-size:11px;color:var(--mute);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--green);display:block}
.dots i.job{background:var(--deep)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:10px 4px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px;background:var(--c);border:1px solid var(--line)}
.hlist{margin:0;padding:0;list-style:none}
.hlist li{display:flex;gap:10px;padding:5px 0;border-top:1px solid #f0e0e0;font-size:14px}
.hlist li:first-child{border-top:0}
.hlist .d{color:var(--red);font-weight:700;min-width:96px}
/* events */
.dayh{font-size:17px;font-weight:700;color:var(--deep);margin:0 0 6px}
.dayh.red{color:var(--red)}
.tag{display:inline-block;background:var(--red);color:#fff;border-radius:999px;font-size:12px;padding:1px 10px;margin-left:8px;vertical-align:2px;font-weight:700}
.tag.we{background:#e57373}
.ev{border-left:5px solid var(--green);background:#fbfdfc;border-radius:10px;padding:10px 12px;margin:8px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ev.job{border-left-color:var(--deep);background:#fafcff}
.ev .who{font-size:12px;font-weight:700;color:var(--green);letter-spacing:.02em;margin-bottom:2px}
.ev.job .who{color:var(--deep)}
.ev .l{font-size:15.5px;line-height:1.6;word-break:break-word}
.ev .l b{color:var(--deep)}
.ev .w{font-size:14px;color:#374559;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.ev .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal[hidden]{display:none}
.box{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:18px 18px 16px;margin:auto;box-shadow:0 20px 50px rgba(10,20,40,.35)}
.box h2{margin:0 0 4px;color:var(--deep);font-size:19px}
.box .jobnote{font-size:13px;color:var(--mute);margin-bottom:4px}
.box label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:12px 0 4px}
.box input,.box textarea,.box select{width:100%;padding:10px 11px;border:1px solid #c5cfdd;border-radius:10px;color:var(--ink);background:#fff;font-size:16px}
.box input:focus,.box textarea:focus,.box select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(53,109,183,.22)}
.box textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box .acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.box .acts #fDel{margin-right:auto}
@media(max-width:700px){
  main{padding:10px 8px 40px}
  .hero{padding:10px 12px;gap:12px}.hero img{width:104px}.hero .tx{padding-left:12px}.hero h1{font-size:18px}.hero p{font-size:12px}
  .tools{padding:8px}.nav{width:100%}.month{flex:1;min-width:0;font-size:18px}
  .tools .sp{display:none}
  .tools>*{flex:1 1 auto}.tools .nav,.tools .nav>*{flex:initial}.nav .month{flex:1}
  .cell{min-height:70px;padding:3px 2px;text-align:center}
  .chip,.more,.hn{display:none}.dots{display:flex}
  .n{min-width:24px;height:24px;line-height:24px;font-size:14px}
  .cell.hol::after{content:"";position:absolute;left:50%;top:5px;margin-left:11px;width:6px;height:6px;border-radius:50%;background:var(--red)}
  .dow{font-size:12px;padding:7px 0}
  .card{padding:12px;border-radius:14px}
  .pool .it{flex-direction:column;align-items:stretch}.pool .it button{width:100%}
  .hlist .d{min-width:84px}
  .modal{align-items:flex-end;padding:0}
  .box{border-radius:18px 18px 0 0;max-width:none;margin:0;max-height:94vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
}

/* week plan (vertical, Monday to Sunday) */
.wv{display:flex;flex-direction:column;gap:10px}
.wd{display:grid;grid-template-columns:170px 1fr;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(36,71,127,.05)}
.wdh{background:#f1f5fb;padding:10px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:flex-start;cursor:pointer}
.wdh b{color:var(--deep);font-size:15px}
.wd.we .wdh{background:var(--redbg)}.wd.hol .wdh{background:var(--redbg2)}
.wd.we .wdh b,.wd.hol .wdh b{color:var(--red)}
.wd.tdy{box-shadow:0 0 0 2px var(--sky)}
.wdb{padding:8px 10px;display:flex;flex-direction:column;gap:7px;min-width:0}
.wd.we .wdb{background:#fffafa}.wd.hol .wdb{background:#fff6f6}
.wgrp{font-size:12px;font-weight:700;color:var(--mute);margin-top:2px}
.wempty{color:#aab4c4;padding:2px 0}
.wi{border-left:4px solid var(--green);background:var(--greenbg);border-radius:8px;padding:7px 10px;line-height:1.45;word-break:break-word;font-size:14px}
.wi.job{border-left-color:var(--deep);background:var(--jobbg)}
.wi b{color:var(--deep)}.wi .ww{color:#374559;white-space:pre-wrap}
.wi button{margin-top:6px}
.memo textarea{width:100%;min-height:140px;padding:11px 12px;border:1px solid #c5cfdd;border-radius:10px;font-size:16px;line-height:1.5;color:var(--ink);resize:vertical;background:#fffef8}
.memo textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(53,109,183,.22)}
.memo textarea[readonly]{background:#f4f6f9}
.memo .st{font-size:12px;color:var(--mute);min-height:16px;margin-top:4px}
.noteprint{display:none;white-space:pre-wrap;font-size:13px}
.printhead{display:none}
.xbtn{display:block;width:100%;text-align:left;margin-top:8px;min-height:46px}
.xrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){
  .wd{grid-template-columns:1fr}
  .wdh{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@page{size:A4 landscape;margin:10mm}
@media print{
  .top,.tools,.pool,.legend,#yeNav,.acts,#day,.msg,.modal,.hero{display:none!important}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  main{max-width:none;padding:0}
  .printhead{display:flex!important;align-items:center;gap:14px;border-bottom:3px solid var(--blue);padding-bottom:8px;margin-bottom:10px}
  .printhead img{width:150px;height:auto}.printhead b{font-size:18px;color:var(--deep)}.printhead div{font-size:13px;color:var(--mute)}
  .grid,.wd,.card{box-shadow:none;break-inside:avoid}.wi button,.wdh button,.memo textarea,.memo .st{display:none!important}.noteprint{display:block!important}.memo{break-inside:avoid}
  .cell{min-height:84px}.chip,.more,.hn{display:block!important}.dots{display:none!important}
  .hols,#hols{break-inside:avoid}
}
</style>
</head>
<body>
<div class="top"></div>
<main>
  <header class="hero">
    <img src="../assets/logo.png" width="1612" height="540" alt="YE Construction">
    <div class="tx"><h1 id="ttl"></h1><p id="sub"></p></div>
  </header>

  <div class="printhead" id="phead"></div>
  <div class="tools">
    <div class="nav"><button id="prev" type="button" aria-label="Previous month">‹</button><div class="month" id="mlabel" aria-live="polite"></div><button id="next" type="button" aria-label="Next month">›</button></div>
    <button id="today" type="button"></button>
    <span class="sp"></span>
    <select id="emp" hidden aria-label="Employee"></select>
    <select id="region" aria-label="Region"></select>
    <div class="seg"><button id="vGrid" type="button"></button><button id="vWeek" type="button"></button><button id="vList" type="button"></button></div>
    <button id="exp" type="button"></button><button id="lang" type="button"></button>
    <button id="add" type="button" class="pri"></button>
  </div>
  <div class="msg" id="msg" role="status"></div>

  <section class="card pool" id="pool"></section>

  <div id="gridWrap"><div class="grid" id="grid"></div></div>
  <div id="weekWrap" hidden></div>
  <section class="card memo" id="memo" hidden></section>
  <div id="listWrap" hidden></div>
  <div class="legend" id="legend"></div>

  <section class="card" id="day"></section>
  <section class="card" id="hols"></section>
</main>

<div class="modal" id="xmodal" hidden><div class="box">
  <h2 id="xT"></h2><div class="jobnote" id="xHint"></div>
  <div class="xrow"><div><label id="xFL" for="xFrom"></label><input type="date" id="xFrom"></div><div><label id="xTL" for="xTo"></label><input type="date" id="xTo"></div></div>
  <button type="button" class="xbtn" id="xPdf"></button><button type="button" class="xbtn" id="xCsv"></button><button type="button" class="xbtn" id="xJson"></button><button type="button" class="xbtn" id="xImp"></button>
  <input type="file" id="xFile" accept=".csv,.json,text/csv,application/json" hidden>
  <div class="msg" id="xMsg" role="status" style="margin-top:10px"></div>
  <div class="acts"><button type="button" id="xClose"></button></div>
</div></div>

<div class="modal" id="modal" hidden><form class="box" id="form" novalidate>
  <h2 id="fT"></h2>
  <div class="jobnote" id="fJob" hidden></div>
  <div id="fEmpW" hidden><label id="fEmpL" for="fEmp"></label><select id="fEmp"></select></div>
  <div class="row2"><div><label id="fDL" for="fD"></label><input type="date" id="fD" required></div>
  <div><label id="fEL" for="fE"></label><input type="date" id="fE"></div></div>
  <div class="row2"><div><label id="fSL" for="fS"></label><input type="time" id="fS"></div>
  <div><label id="fTL" for="fT2"></label><input type="time" id="fT2"></div></div>
  <label id="fAL" for="fA"></label><input id="fA" autocomplete="off">
  <label id="fPL" for="fP"></label><input id="fP" autocomplete="off">
  <label id="fWL" for="fW"></label><textarea id="fW"></textarea>
  <div class="msg bad" id="fMsg"></div>
  <div class="acts"><button type="button" id="fDel" class="dng" hidden></button><button type="button" id="fCancel"></button><button type="submit" class="pri" id="fSave"></button></div>
</form></div>

/* ---------- entry form ---------- */
function jobDefaults(id,date){

    s.innerHTML=o;s.value=e?e.owner_email.toLowerCase():(d.owner||$('emp').value||me)}

    closeForm();sel=d;vy=+d.slice(0,4);vm=+d.slice(5,7)-1;

/* ---------- week plan, export / import ---------- */
function mondayOf(d){var y=+d.slice(0,4),m=+d.slice(5,7)-1,dd=+d.slice(8);return iso(y,m,dd-dow(y,m,dd))}
function addDays(d,n){return iso(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8)+n)}
function curRange(){return mode==='week'?{s:wk,e:addDays(wk,6)}:gridRange()}
function shortDate(d){return lang==='zh'?(+d.slice(5,7))+'月'+(+d.slice(8))+'日':(+d.slice(8))+' '+t('months')[+d.slice(5,7)-1].slice(0,3)}
function periodLabel(){
  if(mode==='week'){var b=addDays(wk,6);return lang==='zh'?wk.slice(0,4)+'年 '+shortDate(wk)+' – '+shortDate(b):shortDate(wk)+' – '+shortDate(b)+' '+b.slice(0,4)}
  return lang==='zh'?vy+'年 '+t('months')[vm]:t('months')[vm]+' '+vy}
function dayLabel(d){var w=dow(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8));return(lang==='zh'?'周'+t('dow')[w]:t('dow')[w])+' '+shortDate(d)}
function wiHtml(it){
  var ts=it.e&&it.e.source==='timesheet',btn='';
  if(it.kind==='entry'&&!ts&&(isMgr||it.e.created_by.toLowerCase()===me))btn='<div><button type="button" class="sm" data-ee="'+esc(it.e.id)+'">'+esc(t('edit'))+'</button></div>';
  return'<div class="wi '+(it.kind==='job'?'job':'')+'"><b>'+esc(it.st?(it.en?it.st+'–'+it.en:it.st):t('tbc'))+(ts?' ⏱':'')+'</b>'
    +(it.address?'<div>📍 '+esc(it.address)+'</div>':'')+(it.project?'<div>🏗 '+esc(it.project)+'</div>':'')+(it.work?'<div class="ww">'+esc(it.work)+'</div>':'')
    +(it.kind==='job'&&isMgr?'<div class="ww">👷 '+esc(workersOf(it.j)||t('unassigned'))+'</div>':'')+btn+'</div>'}
function renderWeek(){
  var h='<div class="wv">',i;
  for(i=0;i<7;i++){
    var d=addDays(wk,i),hn=holOf(d),its=itemsOn(d);
    h+='<div class="wd'+(i>=5?' we':'')+(hn?' hol':'')+(d===TODAY?' tdy':'')+'"><div class="wdh" data-d="'+d+'"><b>'+esc(dayLabel(d))+'</b>'
      +(hn?'<span class="tag" style="margin:0">'+esc(hn)+'</span>':i>=5?'<span class="tag we" style="margin:0">'+esc(t('weekend'))+'</span>':'')
      +'<button type="button" class="sm" data-add="'+d+'">'+esc(t('addDay'))+'</button></div><div class="wdb">';
    if(!its.length)h+='<div class="wempty">—</div>';
    else{
      its.filter(function(x){return x.kind==='job'}).forEach(function(x){h+=wiHtml(x)});
      var last='';
      its.filter(function(x){return x.kind==='entry'}).sort(function(a,b){var A=(a.e.owner_name||a.e.owner_email),B=(b.e.owner_name||b.e.owner_email);return A<B?-1:A>B?1:0}).forEach(function(x){
        var who=x.e.owner_name||nameOf(x.e.owner_email);
        if(isMgr&&who!==last){h+='<div class="wgrp">👷 '+esc(who)+'</div>';last=who}
        h+=wiHtml(x)})}
    h+='</div></div>'}
  h+='</div>';
  var el=$('weekWrap');el.innerHTML=h;
  Array.prototype.forEach.call(el.querySelectorAll('[data-add]'),function(b){b.onclick=function(ev){ev.stopPropagation();sel=b.getAttribute('data-add');openForm(null)}});
  Array.prototype.forEach.call(el.querySelectorAll('.wdh[data-d]'),function(c){c.onclick=function(){sel=c.getAttribute('data-d')}});
  bindEv(el)}
/* weekly notes (one note per person per week, saved in the cloud) */
function noteOwner(){var f=$('emp').value;return isMgr&&f?f:me}
async function loadNote(){
  try{var a=await sb('/rest/v1/ye_sched_notes?select=note&owner_email=eq.'+encodeURIComponent(noteOwner())+'&week_start=eq.'+wk)||[];note=a[0]?a[0].note:'';noteOk=true}
  catch(e){note='';noteOk=false}}
function renderMemo(){
  var el=$('memo');el.hidden=mode!=='week';if(mode!=='week')return;
  var ro=noteOwner()!==me;
  el.innerHTML='<h2>'+esc(t('noteT'))+'</h2>'+(noteOk?'<textarea id="noteTa" '+(ro?'readonly ':'')+'placeholder="'+esc(t('notePh'))+'" maxlength="5000">'+esc(note)+'</textarea><div class="st" id="noteSt">'+(ro?esc(t('noteRO')):'')+'</div><div class="noteprint">'+esc(note)+'</div>':'<div class="msg bad">'+esc(t('setupHint'))+'</div>');
  var ta=$('noteTa');if(!ta||ro)return;
  ta.oninput=function(){
    note=ta.value;var w=wk,txt=note;$('noteSt').textContent=t('noteSaving');clearTimeout(noteTimer);
    noteTimer=setTimeout(function(){saveNote(w,txt)},900)}}
async function saveNote(w,txt){
  try{await sb('/rest/v1/ye_sched_notes?on_conflict=owner_email,week_start',{method:'POST',body:JSON.stringify({owner_email:me,week_start:w,note:txt,updated_at:new Date().toISOString()}),prefer:'resolution=merge-duplicates,return=minimal'});
    var s=$('noteSt');if(s&&w===wk)s.textContent=t('noteSaved')+new Date().toLocaleTimeString(lang==='zh'?'zh-CN':'en-NZ',{hour:'2-digit',minute:'2-digit'})}
  catch(e){var s2=$('noteSt');if(s2)s2.textContent=t('saveFail')+netMsg(e)}}
function printHead(){
  var f=$('emp').value,who=isMgr&&f?' · '+nameOf(f):(isMgr?' · '+t('allEmp'):' · '+(myName||me));
  var rn='';REGIONS.forEach(function(r){if(r[0]===region)rn=lang==='zh'?r[2]:r[1]});
  $('phead').innerHTML='<img src="../assets/logo.png" alt="YE Construction"><div><b>'+esc(t('ttl'))+' · '+esc(periodLabel())+'</b><br>'+esc(who.slice(3))+' · '+esc(rn)+'</div>'}

function xmsg(s,bad){var m=$('xMsg');m.textContent=s||'';m.className='msg'+(bad?' bad':'')}
function openExp(){
  var r=curRange(),first=mode==='week'?r.s:iso(vy,vm,1),last=mode==='week'?r.e:iso(vy,vm+1,0);
  ['xT','xHint','xFL','xTL','xPdf','xCsv','xJson','xImp','xClose'].forEach(function(k){$(k).textContent=t(k)});
  $('xFrom').value=first;$('xTo').value=last;xmsg('');$('xmodal').hidden=false}
function doPdf(){
  $('xmodal').hidden=true;var old=document.title;
  document.title='YE-Schedule-'+periodLabel().replace(/[^\w一-鿿]+/g,'-');
  window.addEventListener('afterprint',function once(){document.title=old;window.removeEventListener('afterprint',once)});
  setTimeout(function(){window.print()},120)}
async function fetchRange(s,e,all){
  var a=await sb('/rest/v1/ye_sched_entries?select=*&work_date=lte.'+e+'&end_date=gte.'+s+'&order=work_date.asc,start_time.asc&limit=5000')||[];
  var f=$('emp').value;if(!all&&isMgr&&f)a=a.filter(function(x){return x.owner_email.toLowerCase()===f});return a}
var COLS=['employee_email','employee_name','date','end_date','start_time','end_time','address','project','work'];
function outRows(a){return a.map(function(e){return{employee_email:e.owner_email,employee_name:e.owner_name,date:e.work_date,end_date:e.end_date,start_time:e.start_time,end_time:e.end_time,address:e.address,project:e.project,work:e.work}})}
function csvCell(v){v=String(v==null?'':v);return/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvParse(txt){
  var rows=[],row=[],cur='',q=false,i,c;
  for(i=0;i<txt.length;i++){c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(function(x){return x!==''}))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);if(row.some(function(x){return x!==''}))rows.push(row);
  if(!rows.length)return[];
  var head=rows[0].map(function(x){return x.trim().toLowerCase()});
  return rows.slice(1).map(function(r){var o={};head.forEach(function(h,k){o[h]=(r[k]||'').trim()});return o})}
function download(name,text,type){var b=new Blob([text],{type:type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800)}
async function doExport(kind){
  var s=$('xFrom').value,e=$('xTo').value;if(!s||!e||e<s){xmsg(t('noRange'),true);return}
  xmsg(t('loading'));
  try{var rows=outRows(await fetchRange(s,e,false)),nm='YE-Schedule-'+s+'_'+e;
    if(kind==='csv')download(nm+'.csv','﻿'+COLS.join(',')+'\r\n'+rows.map(function(r){return COLS.map(function(c){return csvCell(r[c])}).join(',')}).join('\r\n'),'text/csv;charset=utf-8');
    else download(nm+'.json',JSON.stringify({app:'YE-Schedule',version:1,exported:new Date().toISOString(),from:s,to:e,entries:rows},null,1),'application/json');
    xmsg(t('expDone')+rows.length)}
  catch(er){xmsg(netMsg(er),true)}}
function normDate(v){
  v=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
  var m=/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/.exec(v);if(!m)return'';
  var y=+m[3];if(y<100)y+=2000;return iso(y,+m[2]-1,+m[1])}
function normTime(v){var m=/^(\d{1,2}):(\d{2})/.exec(String(v||'').trim());return m&&+m[1]<24&&+m[2]<60?p2(+m[1])+':'+m[2]:''}
async function doImport(file){
  xmsg(t('loading'));
  try{
    var txt=(await file.text()).replace(/^﻿/,''),src;
    try{if(/^\s*[\[{]/.test(txt)){var j=JSON.parse(txt);src=Array.isArray(j)?j:(j.entries||[])}else src=csvParse(txt)}catch(e){xmsg(t('impBad'),true);return}
    if(!Array.isArray(src)||!src.length){xmsg(t('impNone'),true);return}
    var out=[],bad=0;
    src.forEach(function(r){
      var d=normDate(r.date||r.work_date),e=normDate(r.end_date)||d;if(!d||e<d){bad++;return}
      var owner=isMgr?String(r.employee_email||r.owner_email||'').trim().toLowerCase()||me:me;
      out.push({owner_email:owner,owner_name:owner===me?myName:(r.employee_name||r.owner_name||nameOf(owner)),created_by:me,work_date:d,end_date:e,
        start_time:normTime(r.start_time),end_time:normTime(r.end_time),address:String(r.address||'').trim(),project:String(r.project||'').trim(),work:String(r.work||'').trim(),source:'import'})});
    if(!out.length){xmsg(t('impNone'),true);return}
    var lo=out.reduce(function(a,x){return x.work_date<a?x.work_date:a},out[0].work_date),hi=out.reduce(function(a,x){return x.end_date>a?x.end_date:a},out[0].end_date);
    var key=function(x){return[x.owner_email.toLowerCase(),x.work_date,x.end_date,x.start_time,x.end_time,x.address.toLowerCase(),x.project.toLowerCase(),x.work.toLowerCase()].join('|')};
    var have={};(await fetchRange(lo,hi,true)).forEach(function(x){have[key({owner_email:x.owner_email,work_date:x.work_date,end_date:x.end_date,start_time:x.start_time,end_time:x.end_time,address:x.address,project:x.project,work:x.work})]=1});
    var fresh=out.filter(function(x){var k=key(x);if(have[k])return false;have[k]=1;return true}),dup=out.length-fresh.length;
    if(!fresh.length){xmsg(t('impNone'),true);return}
    if(!confirm(t('impAsk').replace('{n}',fresh.length).replace('{d}',dup).replace('{b}',bad))){xmsg('');return}
    for(var i=0;i<fresh.length;i+=100)await sb('/rest/v1/ye_sched_entries',{method:'POST',body:JSON.stringify(fresh.slice(i,i+100)),prefer:'return=minimal'});
    xmsg(t('impDone').replace('{n}',fresh.length));await reload()
  }catch(er){xmsg(t('saveFail')+netMsg(er),true)}}

/* ---------- wiring ---------- */
function shift(n){if(mode==='week'){wk=addDays(wk,7*n);var mid=addDays(wk,3);vy=+mid.slice(0,4);vm=+mid.slice(5,7)-1;if(sel<wk||sel>addDays(wk,6))sel=wk}else{vm+=n;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}}reload()}
async function reload(){try{await loadEntries();if(mode==='week')await loadNote()}catch(e){say(t('loadFail')+netMsg(e),true)}render()}
$('prev').onclick=function(){shift(-1)};$('next').onclick=function(){shift(1)};
$('today').onclick=function(){vy=+TODAY.slice(0,4);vm=+TODAY.slice(5,7)-1;sel=TODAY;wk=mondayOf(TODAY);reload()};
$('add').onclick=function(){openForm(null)};
function setMode(m){mode=m;lsSet('ye_sched_mode',mode);if(m==='week'){wk=mondayOf(sel);var mid=addDays(wk,3);vy=+mid.slice(0,4);vm=+mid.slice(5,7)-1}reload()}
$('vGrid').onclick=function(){setMode('grid')};$('vWeek').onclick=function(){setMode('week')};$('vList').onclick=function(){setMode('list')};
$('lang').onclick=function(){lang=lang==='zh'?'en':'zh';lsSet('ye_sched_lang',lang);render()};
$('region').onchange=function(){region=$('region').value;lsSet('ye_sched_region',region);render()};
$('emp').onchange=function(){if(mode==='week')reload();else render()};
$('exp').onclick=openExp;$('xClose').onclick=function(){$('xmodal').hidden=true};$('xPdf').onclick=doPdf;$('xCsv').onclick=function(){doExport('csv')};$('xJson').onclick=function(){doExport('json')};$('xImp').onclick=function(){$('xFile').click()};$('xFile').onchange=function(){if(this.files[0])doImport(this.files[0]);this.value=''};
$('xmodal').addEventListener('mousedown',function(e){if(e.target===$('xmodal'))$('xmodal').hidden=true});
$('form').onsubmit=saveForm;$('fCancel').onclick=closeForm;$('fDel').onclick=delForm;
$('modal').addEventListener('mousedown',function(e){if(e.target===$('modal'))closeForm()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('modal').hidden)closeForm()});

/* office only: make sure every employee's timesheet shifts are on the schedule, even if their phone has not synced them yet */
function normA(x){return String(x||'').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]/g,'')}
async function syncTimesheets(){
  var rows=await sb('/rest/v1/ye_timesheets?select=id,email,employee,shifts:data-%3Eshifts&order=updated_at.desc&limit=300')||[];
  var key=function(x){return[x.ts_id,x.work_date,x.start_time||'',x.end_time||'',normA(x.address)].join('|')};
  var want={},ids={};
  rows.forEach(function(r){
    var email=String(r.email||'').trim().toLowerCase();if(!email||!Array.isArray(r.shifts))return;ids[String(r.id)]=1;
    r.shifts.forEach(function(s){
      if(!Array.isArray(s))return;var date=String(s[0]||'');if(!/^\d{4}-\d\d-\d\d$/.test(date))return;
      var loc=String(s[4]||'').trim(),na=normA(loc),cow=String(s[5]||'').trim();
      var job=na.length>=6?jobs.filter(function(j){var a=normA(j.address);return a.length>=6&&(a.indexOf(na)>=0||na.indexOf(a)>=0)})[0]:null;
      var row={owner_email:email,owner_name:r.employee||email.split('@')[0],created_by:email,work_date:date,end_date:date,start_time:String(s[1]||''),end_time:String(s[2]||''),address:loc,
        project:job?(job.project||''):'',work:'Timesheet 工时表'+(cow?' · '+cow:''),job_id:job?job.job_id:null,source:'timesheet',ts_id:String(r.id)};
      want[key(row)]=row})});
  var have=await sb('/rest/v1/ye_sched_entries?select=id,work_date,start_time,end_time,address,ts_id&source=eq.timesheet&limit=10000')||[];
  var haveKeys={},extra=[];
  have.forEach(function(x){var k=key(x);if(want[k]&&!haveKeys[k])haveKeys[k]=1;else if(ids[x.ts_id])extra.push(x.id)});
  var add=Object.keys(want).filter(function(k){return !haveKeys[k]}).map(function(k){return want[k]}),i;
  for(i=0;i<extra.length;i+=50)await sb('/rest/v1/ye_sched_entries?id=in.('+extra.slice(i,i+50).join(',')+')',{method:'DELETE'});
  for(i=0;i<add.length;i+=100)await sb('/rest/v1/ye_sched_entries',{method:'POST',body:JSON.stringify(add.slice(i,i+100)),prefer:'return=minimal'});
  return add.length+extra.length>0}
async function boot(){
  render();
  if(!ses){say('Please sign in from the home page. 请先在主页登录。',true);return}
  say(t('loading'));
  var failed=false;
  try{
    await loadStaff();
    if(isMgr){try{await syncJobs()}catch(e){say(t('syncFail')+netMsg(e),true);failed=true}}
    await Promise.all([loadJobs(),loadEntries()]);
    if(isMgr){try{if(await syncTimesheets())await loadEntries()}catch(e){}}
    if(mode==='week')await loadNote();
    if(!failed)say('');
  }catch(e){say(t('loadFail')+netMsg(e),true)}
  render()}
boot();
window.__sched={holidays:holidays};
})();
