<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="YE Construction — New Zealand.">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="YE Construction">
<meta name="application-name" content="YE Construction">
<title>YE Construction</title>
<style>
:root{--blue:#356db7;--deep:#24477f;--sky:#62a0db;--ink:#172033;--mute:#5d6b82;--line:#d8dee9;--bg:#f4f7fb}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Arial,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;min-height:100vh}
.top{height:6px;background:linear-gradient(90deg,var(--deep) 0 34%,var(--blue) 34% 67%,var(--sky) 67%)}
main{flex:1;width:100%;max-width:920px;margin:0 auto;padding:clamp(28px,7vh,72px) 16px 32px}
.brand{background:#fff;border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,34px);text-align:center}
.brand img{width:min(520px,100%);height:auto;display:block;margin:0 auto}
.brand p{margin:10px 0 0;color:var(--mute);font-size:14px;letter-spacing:.04em}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:34px 4px 12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
a.card{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:18px 18px 16px;text-decoration:none;color:inherit;min-height:132px;transition:border-color .15s,transform .15s,box-shadow .15s}
a.card:nth-child(2){border-left-color:var(--deep)}
a.card:nth-child(3){border-left-color:var(--sky)}
a.card:hover,a.card:focus-visible{transform:translateY(-2px);box-shadow:0 8px 22px rgba(36,71,127,.14);outline:none}
a.card:focus-visible{box-shadow:0 0 0 3px rgba(53,109,183,.35)}
.card b{font-size:18px;color:var(--deep)}
.card span{font-size:13px;color:var(--mute);line-height:1.45}
.card em{margin-top:auto;font-style:normal;font-size:13px;font-weight:700;color:var(--blue)}
.note{margin:14px 4px 0;font-size:12px;color:var(--mute)}
footer{text-align:center;font-size:12px;color:var(--mute);padding:18px 16px 26px}
@media(max-width:720px){.grid{grid-template-columns:1fr}a.card{min-height:0}}
@media(prefers-reduced-motion:reduce){a.card{transition:none}a.card:hover{transform:none}}
</style>
</head>
<body>
<div class="top"></div>
<main>
  <div class="brand">
    <img src="assets/logo.png" alt="YE Construction" width="1612" height="540">
    <p>New Zealand</p>
  </div>

  <h2>Staff systems · 内部系统</h2>
  <div class="grid">
    <a class="card" href="business-system/">
      <b>Business System</b>
      <span>Quotes, invoices and job reports<br>报价、发票与项目报告</span>
      <em>Open →</em>
    </a>
    <a class="card" href="timesheet/">
      <b>Timesheet</b>
      <span>Employee time and expense records<br>员工工时与报销记录</span>
      <em>Open →</em>
    </a>
    <a class="card" href="qa/">
      <b>QA Inspection</b>
      <span>Site quality inspection checklists<br>现场质量检查表</span>
      <em>Open →</em>
    </a>
  </div>
  <p class="note">Sign-in required. 需要登录后使用。</p>
</main>
<footer>© YE Construction · yeconstruction.co.nz</footer>
</body>
</html>
